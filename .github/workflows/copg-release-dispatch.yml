name: Notify KernelSU module repo

# Fires the moment you publish a release on AlirezaParsi/COPG,
# telling KernelSU-Modules-Repo/COPG to mirror the new zip.

on:
  release:
    types: [published]
  workflow_dispatch:   # manual re-fire when a sync failed/was missed

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger module-repo sync
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MODULE_DISPATCH_PAT }}" \
            https://api.github.com/repos/KernelSU-Modules-Repo/COPG/dispatches \
            -d '{"event_type":"sync-release"}'
